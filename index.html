<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Polonais pas à pas</title>
<meta name="description" content="Apprendre le polonais de zéro : alphabet, prononciation, syllabes, grammaire et dictées, jusqu’au niveau B2.">
<meta name="theme-color" content="#C42B3F">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📚%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F5F7;--surface:#fff;--ink:#17232F;--mute:#56667A;--line:#D5DDE4;--red:#C42B3F;--ok:#23704F;--okbg:#E1F2EA;--badbg:#FBE4E7;--warn:#FFF3D6;
--head:"Bricolage Grotesque",system-ui,sans-serif;--body:"Source Serif 4",Georgia,serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1720;--surface:#18232F;--ink:#E8EEF3;--mute:#9AABBB;--line:#2B3A49;--red:#F0627A;--ok:#5CC99A;--okbg:#17372B;--badbg:#44202A;--warn:#3D3418;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1720;--surface:#18232F;--ink:#E8EEF3;--mute:#9AABBB;--line:#2B3A49;--red:#F0627A;--ok:#5CC99A;--okbg:#17372B;--badbg:#44202A;--warn:#3D3418;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.65 var(--body)}
.wrap{max-width:640px;margin:0 auto;padding:20px 18px 60px}
h1,h2,h3{font-family:var(--head);line-height:1.2;margin:0}
h1{font-size:2rem}h2{font-size:1.5rem;margin-bottom:8px}h3{font-size:1.1rem;margin:28px 0 10px}
p{margin:0 0 12px}
.mute{color:var(--mute);font-size:.95rem}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:14px 0 4px}
.bar i{display:block;height:100%;background:var(--red);transition:width .4s}
.level{font-family:var(--head);font-weight:700;margin:30px 0 4px}
.mod{display:flex;gap:12px;align-items:center;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:8px;color:inherit;text-decoration:none}
.mod:hover{border-color:var(--red)}
.mod b{font-family:var(--head);font-weight:500;display:block}
.dot{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.85rem;font-family:var(--head)}
.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.soon{opacity:.75;border-style:dashed}
.back{display:inline-block;margin-bottom:16px;color:var(--mute);text-decoration:none;font-family:var(--head)}
.vocab{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.w{flex:1;min-width:0}
.pl{font-family:var(--head);font-weight:700;font-size:1.1rem}
.ph{font-style:italic;color:var(--red);font-size:.95rem}
.fr{color:var(--mute);font-size:.9rem;line-height:1.3}
.bt{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;font-size:.95rem;display:grid;place-items:center;text-decoration:none}
.ch{min-width:44px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:inherit;font:700 1.1rem var(--head);cursor:pointer;margin:3px}.ch.on{background:var(--red);color:#fff;border-color:var(--red)}
.dc{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:inherit;width:150px;margin:6px 4px}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.how{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:.92rem;line-height:1.5}
.warn{background:var(--warn);border-radius:8px;padding:10px 12px;margin-top:10px;font-size:.9rem;display:none}
.tip{border-left:4px solid var(--red);padding:4px 0 4px 14px;margin-top:22px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.q p{font-weight:600}
.opt{display:block;width:100%;text-align:left;margin-top:8px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:inherit;font:inherit;cursor:pointer}
.opt.good{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--red)}
.btn{display:inline-block;background:var(--red);color:#fff;border:0;border-radius:8px;padding:12px 18px;font-family:var(--head);font-weight:700;text-decoration:none;cursor:pointer;font-size:1rem}
.play{display:inline-flex;gap:8px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 14px;color:inherit;font:inherit;cursor:pointer;margin-bottom:4px}
.result{margin-top:16px}
.reset{background:none;border:0;color:var(--mute);text-decoration:underline;cursor:pointer;font:inherit;margin-top:36px;padding:0}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>

{id:"a1",t:"L’alphabet complet et ses sons",i:"Voici les 32 lettres du polonais avec leur son. Apprends-les comme à l’école primaire : une lettre, un son, un mot exemple. Appuie sur une lettre pour entendre son nom, puis son mot exemple. Une consonne seule ne se prononce pas : on l’entend vraiment dans le mot.",

{id:"a2",t:"Lire les syllabes : B + A = BA",i:"Comme à l’école primaire, on lit en associant une consonne et une voyelle. Une syllabe, puis deux, puis un mot entier.",
g:["<b>Le principe.</b> B + A = BA. M + A = MA. MA + MA = MAMA. Tu sais déjà lire en polonais dès que tu connais ces petites briques.","<b>Les voyelles simples.</b> a = a, e = è, i = i, o = o, u = ou, y = i reculé. Les consonnes gardent toujours le même son : w = v, ł = ou, j = y, g = g dur (gi se lit « gui »).","<b>Les 3 étapes.</b> 1. Joue avec le constructeur ci-dessous. 2. Lis chaque ligne de syllabes à voix haute. 3. Lis les mots coupés en syllabes, d’abord lentement puis en un seul souffle."],

{id:"a3",t:"Les syllabes douces : NI, CI, SI, ZI, DZI",i:"Une règle qui revient dans presque chaque mot polonais. Une fois comprise, tu liras beaucoup plus vite.",
g:["<b>La règle du « i » doux.</b> Quand n, c, s, z, dz sont suivies de « i », la consonne devient douce et mouillée : ni = gni, ci = tchi, si = chi, zi = ji, dzi = dji.","<b>« i » + voyelle.</b> Si le « i » est suivi d’une voyelle, il ne se lit pas : il sert juste à adoucir. « nia » = gna, « cia » = tcha, « sia » = cha, « zia » = ja, « dzia » = dja.","<b>Deux façons d’écrire le même son.</b> Devant une voyelle, on écrit « i » (siostra). Devant une consonne ou en fin de mot, on écrit la lettre accentuée : ś, ć, ź, ń, dź (środa, ćma, koń)."],

{id:"m1",t:"Alphabet et prononciation",i:"Le polonais s’écrit comme il se prononce. Cette leçon est la plus importante du parcours : prends ton temps et écoute chaque mot plusieurs fois.",
g:["Le polonais compte 32 lettres. Chaque lettre a un seul son et il n’y a aucune lettre muette. Les signes comme ą, ę, ć, ł, ń, ó, ś, ź, ż ne sont pas des accents : ce sont des lettres à part entière.",
"<b>Les sons à distinguer.</b> « sz » = ch dur (chat), « ż » et « rz » = j dur (jour), « cz » = tch dur. Leurs versions douces s’écrivent « ś », « ć », « ź » ou « si », « ci », « zi » avant une voyelle : siostra, ciasto, dziękuję.",
"<b>Les voyelles nasales.</b> « ą » ressemble à « on » et « ę » à « in ». À la fin d’un mot, « ę » devient presque un « è » simple. Devant p ou b, ils se lisent « om » et « em ».",
"<b>« ł » et « w ».</b> « ł » se prononce comme le w de « water ». « w » se prononce « v » (woda = voda).",
"<b>L’accent tonique</b> tombe presque toujours sur l’avant-dernière syllabe. Dans la transcription ci-dessous, la syllabe en majuscules est celle qu’on appuie.",
"<b>Fin de mot.</b> Une consonne sonore finale se durcit : « chleb » se lit « hlèp »."],

{id:"m2",t:"Salutations et se présenter",i:"Les phrases à connaître dès le premier jour pour être poli et se faire comprendre.",
g:["<b>Deux niveaux de politesse.</b> Avec un inconnu, un professeur ou un collègue, on dit « pan » (monsieur) ou « pani » (madame). Avec des amis ou la famille, on se tutoie avec « ty ».",
"<b>Les salutations.</b> « Dzień dobry » (mot à mot : bon jour) se dit de la première rencontre jusqu’à la fin d’après-midi. Le soir, on dit « Dobry wieczór ». « Cześć » s’emploie à l’arrivée comme au départ, entre proches seulement.",
"<b>Se présenter.</b> « Mam na imię… » signifie « j’ai pour prénom… ». On peut aussi dire « Nazywam się… » (je m’appelle). À « Jak się masz ? », on répond « Dobrze, dziękuję » (bien, merci)."],

tip:"Dans « Nie », le « ie » se lit « gné » comme dans « montagne ».",
q:[["Comment dire « merci » ?",["Proszę","Dziękuję","Przepraszam"],1],["Quelle formule utilise-t-on avec un professeur ?",["Cześć","Dzień dobry","Mam na imię"],1],["« Mam na imię… » signifie…",["je m’appelle…","j’ai faim","je suis étudiant"],0],["@Dziękuję",["merci","au revoir","pardon"],0]]},
{id:"m3",t:"Le verbe être (być)",i:"Le verbe « być » est le plus utilisé du polonais. Il est irrégulier, donc à apprendre par cœur.",
g:["<b>Conjugaison.</b> ja jestem, ty jesteś, on/ona/ono jest, my jesteśmy, wy jesteście, oni/one są.",
"<b>Le pronom est facultatif.</b> « Jestem » suffit pour dire « je suis », car la terminaison indique la personne. On ajoute « ja » seulement pour insister.",
"<b>Les genres.</b> Le polonais a trois genres : masculin, féminin, neutre. Les adjectifs s’accordent : « zmęczony » (fatigué, homme) et « zmęczona » (fatiguée, femme).",
"<b>Pluriel.</b> « oni » désigne un groupe avec au moins un homme, « one » un groupe de femmes uniquement."],
v:[["ja jestem","je suis","ya YÈS-tèm"],["ty jesteś","tu es","ti YÈS-tèch"],["on / ona jest","il / elle est","on / O-na yèst"],["my jesteśmy","nous sommes","mi yès-TÈCH-mi"],["wy jesteście","vous êtes","vi yès-TÈCH-tchè"],["oni są","ils sont","O-gni son"],["Jestem z Francji","Je viens de France","YÈS-tèm s FRAN-tsyi"],["Jestem zmęczony","Je suis fatigué (homme)","YÈS-tèm zmèn-TCHO-ni"],["Jestem zmęczona","Je suis fatiguée (femme)","YÈS-tèm zmèn-TCHO-na"]],

{id:"m4",t:"Les nombres de 0 à 10",i:"Les nombres servent partout : prix, horaires, numéros de téléphone.",

{id:"m5",t:"Famille, études et quotidien",i:"Du vocabulaire concret pour parler de ta vie et de tes études.",
g:["<b>Repérer le genre.</b> La plupart des noms en « -a » sont féminins (mama, siostra, praca). Ceux qui finissent par une consonne sont masculins (brat, dom, egzamin). Les noms en « -o » ou « -e » sont souvent neutres. Exception : « tata » (papa) est masculin.",
